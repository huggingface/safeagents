[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "safeagents"
version = "0.0.1"
description = "Proxy that blocks LLM tool calls a model makes on its own"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["atif-scan", "httpx>=0.27", "rich>=13", "starlette>=0.40", "uvicorn>=0.30"]

[project.scripts]
safeagents = "safeagents.cli:main"

[tool.uv.sources]
atif-scan = { git = "https://github.com/huggingface/atif-scan", tag = "v0.8.14" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
