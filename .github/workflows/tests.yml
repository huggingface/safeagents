# Unit tests for safeagents itself. Harness end-to-end tests live in tests/harnesses
# and run in their own harness-*.yml workflows.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install safeagents
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest --ignore=tests/harnesses -v
