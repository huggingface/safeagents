# Scans pushed commits for leaked credentials with TruffleHog.
# Adapted from huggingface/transformers' .github/workflows/trufflehog.yml.
name: secret leaks

on:
  push:

permissions: {}

jobs:
  trufflehog:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          # The action runs the `latest` scanner image unless told otherwise; pin it to the action's release.
          version: "3.99.7"
          # Always scan a diff, never the whole history. `github.event.before` is all zeros on the push
          # that creates a branch, so fall back to the default branch and scan the new branch against it.
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.repository.default_branch }}
          # Lob's detector "verifies" any `(live|test)_<35 hex>` match, since its API answers 422 to every
          # key: all false positives. Only report verified or unknown results.
          extra_args: --results=verified,unknown --exclude-detectors=lob
