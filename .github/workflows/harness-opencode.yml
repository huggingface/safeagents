# Runs the real OpenCode CLI through safeagents against a scripted model (tests/harnesses).
# Pull requests test the OpenCode 1.x and 2.x versions docs/opencode.md was checked
# against; pushes to main also test the latest 2.x release, to catch OpenCode changes
# that break the guide. 1.x and 2.x are different npm packages.
name: harness / opencode

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        opencode: ${{ fromJSON(github.event_name == 'pull_request' && '["opencode-ai@1.19.3", "@opencode/cli@2.3.0"]' || '["opencode-ai@1.19.3", "@opencode/cli@2.3.0", "@opencode/cli@latest"]') }}
    name: ${{ matrix.opencode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install safeagents
        run: uv sync --locked

      - name: Install ${{ matrix.opencode }}
        env:
          OPENCODE_PACKAGE: ${{ matrix.opencode }}
        run: |
          npm install --global --no-audit --no-fund "$OPENCODE_PACKAGE"
          opencode --version

      - name: Run OpenCode through safeagents
        run: uv run pytest tests/harnesses/test_opencode.py -v --durations=0
